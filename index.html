<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000008">
<title>Vocab Maze — Lexis</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:sans-serif;background:#000008;color:#fff;margin:0;padding:0;
  min-height:100dvh;overscroll-behavior:none;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;}
#root{padding:6px 8px;max-width:420px;margin:0 auto;}




#cw{position:relative;display:flex;justify-content:center;}
canvas{display:block;border-radius:10px;width:100%;height:auto;touch-action:none;}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,8,0.97);border-radius:10px;padding:16px;border:1.5px solid #7b2fff;box-shadow:0 0 30px rgba(123,47,255,0.4),inset 0 0 60px rgba(0,0,12,0.8);}
#hud{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary,#888);margin-top:5px;}



.gbtn{background:transparent;color:#ffe600;border:1.5px solid #ffe600;border-radius:6px;padding:10px 28px;font-size:14px;font-family:monospace;font-weight:700;cursor:pointer;margin-top:8px;letter-spacing:0.06em;text-shadow:0 0 10px #ffe600;box-shadow:0 0 14px rgba(255,230,0,0.25);transition:background 0.15s,box-shadow 0.15s;}
#anagram-panel{display:none;position:absolute;inset:0;background:rgba(0,0,8,0.97);border-radius:10px;border:1.5px solid #7b2fff;box-shadow:0 0 30px rgba(123,47,255,0.4);flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:9px;}
#anagram-panel.show{display:flex;}
#anagram-def{font-size:12px;color:rgba(255,255,255,0.75);text-align:center;line-height:1.55;max-width:290px;border:1px solid rgba(123,47,255,0.5);border-radius:8px;padding:8px 12px;background:rgba(123,47,255,0.08);}#anagram-title{font-size:12px;color:#00f5ff;text-transform:uppercase;letter-spacing:0.14em;font-family:monospace;text-shadow:0 0 8px #00f5ff;}
#anagram-prompt{font-size:12px;color:rgba(255,255,255,0.4);text-align:center;line-height:1.5;max-width:280px;}
.letter-row{display:flex;flex-direction:row;flex-wrap:nowrap;gap:var(--lg,5px);justify-content:center;width:100%;overflow:visible;}
.row-label{font-size:10px;color:rgba(0,245,255,0.45);text-transform:uppercase;letter-spacing:0.1em;align-self:flex-start;padding-left:2px;font-family:monospace;}
.bank-letter,.ans-slot{width:var(--ts,30px);height:calc(var(--ts,30px)*1.18);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:var(--fs,14px);font-weight:700;font-family:monospace;flex-shrink:0;transition:background 0.1s,border-color 0.1s;}
.bank-letter{background:#0d0025;border:1.5px solid #7b2fff;color:#00f5ff;cursor:pointer;font-family:monospace;text-shadow:0 0 6px #00f5ff;}
.bank-letter:hover,.bank-letter:active{border-color:#ff00c8;background:rgba(255,0,200,0.15);color:#ff00c8;text-shadow:0 0 8px #ff00c8;}
.bank-letter.used{opacity:0.15;cursor:default;pointer-events:none;}
.ans-slot{border:1.5px dashed rgba(123,47,255,0.6);color:#ff00c8;cursor:pointer;font-family:monospace;}
.ans-slot.filled{background:rgba(255,0,200,0.1);border:1.5px solid #ff00c8;}
.ans-slot.correct{background:rgba(0,245,255,0.15);border-color:#00f5ff;color:#00f5ff;}
.ans-slot.wrong{background:rgba(255,50,50,0.12);border-color:#ff3333;color:#ff3333;}
#anagram-feedback{font-size:12px;min-height:16px;text-align:center;font-family:monospace;letter-spacing:0.05em;}
#btn-row{display:flex;gap:8px;align-items:center;}
#check-btn{background:transparent;color:#ffe600;border:1.5px solid #ffe600;border-radius:6px;padding:8px 22px;font-size:13px;font-family:monospace;font-weight:700;cursor:pointer;text-shadow:0 0 8px #ffe600;}
#check-btn:disabled{opacity:0.2;cursor:default;}
#reset-btn{background:transparent;color:rgba(123,47,255,0.8);border:1px solid rgba(123,47,255,0.5);border-radius:6px;padding:8px 16px;font-size:13px;font-family:monospace;cursor:pointer;}
#reset-btn:hover{color:#b44dff;border-color:#b44dff;}
.gbtn:hover,.gbtn:active{background:rgba(255,230,0,0.12);box-shadow:0 0 22px rgba(255,230,0,0.45);}


.dv-btn.active{
  color:#fff;background:rgba(180,77,255,0.3);border-color:#b44dff;
}


/* ── X-zone control ── */
#xzone{
  width:100%;
  height:200px;
  margin:8px 0 0;
  position:relative;
  touch-action:none;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  cursor:pointer;
}
#xcanvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:10px;
}

</style>
</head>
<body>
<div id="root">
  <div id="cw">
    <canvas id="gc"></canvas>
    <div id="ov">
      <div id="ovc">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:300px;">

          <!-- Title -->
          <div style="font-size:22px;font-weight:700;color:#ffe600;text-shadow:0 0 18px #ffe600,0 0 40px #ff00c8;letter-spacing:0.02em">Vocab Maze</div>

          <!-- Difficulty row — always visible -->
          <div style="display:flex;gap:8px" id="diff-row">
            <button onclick="setDiff(this,'easy')"   style="border:1.5px solid #00f5ff;background:rgba(0,245,255,0.1);color:#00f5ff;border-radius:4px;padding:5px 13px;font-size:11px;font-family:monospace;cursor:pointer;font-weight:700;text-shadow:0 0 6px #00f5ff">Easy</button>
            <button onclick="setDiff(this,'medium')" style="border:1px solid rgba(123,47,255,0.5);background:rgba(123,47,255,0.08);color:rgba(180,77,255,0.8);border-radius:4px;padding:5px 13px;font-size:11px;font-family:monospace;cursor:pointer;font-weight:700">Medium</button>
            <button onclick="setDiff(this,'hard')"   style="border:1px solid rgba(123,47,255,0.5);background:rgba(123,47,255,0.08);color:rgba(180,77,255,0.8);border-radius:4px;padding:5px 13px;font-size:11px;font-family:monospace;cursor:pointer;font-weight:700">Hard</button>
          </div>

          <!-- Step 1: Load Definition button (shown first) -->
          <div id="step-load">
            <div style="font-size:11px;color:rgba(0,245,255,0.4);text-align:center;line-height:2;margin-bottom:8px;font-family:monospace;letter-spacing:0.05em">Collect letters<br>Watch them fly<br>Spell the word</div>
            <button class="gbtn" onclick="loadDefinition()" style="width:100%;padding:12px 24px;font-size:15px;">📖 Load Definition</button>
          </div>

          <!-- Step 2: Definition box + Start button (shown after loading) -->
          <div id="step-start" style="display:none;width:100%;">
            <div style="font-size:9px;color:#00f5ff;text-transform:uppercase;letter-spacing:0.16em;margin-bottom:7px;text-align:center;font-family:monospace;text-shadow:0 0 6px #00f5ff;">&#128196; Read the definition carefully</div>
            <div id="start-def-text" style="font-size:13px;color:rgba(255,255,255,0.85);line-height:1.65;text-align:center;background:rgba(123,47,255,0.08);border:1px solid rgba(123,47,255,0.5);border-radius:8px;padding:12px 14px;margin-bottom:10px;"></div>
            <div style="font-size:11px;color:rgba(123,47,255,0.7);text-align:center;margin-bottom:10px;font-family:monospace;letter-spacing:0.05em">Work out the word, then press Start</div>
            <button class="gbtn" onclick="beginMaze()" style="width:100%;padding:12px 24px;font-size:15px;">▶ Start</button>
          </div>

        </div>
      </div>
    </div>
    <div id="result-panel" style="display:none;position:absolute;inset:0;background:rgba(0,0,8,0.97);border-radius:10px;border:1.5px solid #7b2fff;box-shadow:0 0 30px rgba(123,47,255,0.4);flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:12px;"></div>
    <div id="anagram-panel">
      <div id="anagram-def"></div>
      <div id="anagram-title">Arrange the letters</div>
      <div id="anagram-prompt"></div>
      <div class="row-label">Letter bank</div>
      <div class="letter-row" id="letter-bank"></div>
      <div class="row-label" style="margin-top:2px">Your answer</div>
      <div class="letter-row" id="answer-slots"></div>
      <div id="anagram-feedback"></div>
      <div id="btn-row">
        <button id="reset-btn" onclick="resetAnagram()">↺ Reset</button>
        <button id="check-btn" onclick="checkAnagram()" disabled>Check ✓</button>
      </div>
    </div>
  </div>
  <div id="hud"><span>Score: <b id="sv">0</b></span><span id="lv">♥ ♥ ♥</span></div>
  <!-- X-zone control: full area divided into 4 triangular tap zones -->
  <div id="xzone">
    <canvas id="xcanvas"></canvas>
  </div>
</div>
<script>
// ── Canvas sizing — fit to screen width ──────────────────────
(function(){
  var COLS=18, ROWS=16, STAGING_H=28, DEF_H=36;
  var root = document.getElementById('root') || document.body;
  // Available width = min(screen, 420) minus padding
  var availW = Math.min(window.innerWidth, 420) - 16;
  var CELL = Math.floor(availW / COLS);
  // Snap to even number for crisp rendering
  if(CELL % 2 !== 0) CELL--;
  var W = COLS * CELL;
  var H = ROWS * CELL + STAGING_H + DEF_H;
  var canvas = document.getElementById('gc');
  canvas.width = W;
  canvas.height = H;
  // Store for game JS to pick up
  window._CELL = CELL;
  window._W = W;
  window._H = H;
})();

// ── iOS Audio unlock (requires user gesture) ──────────────────
var _audioUnlocked = false;
function unlockAudio(){
  if(_audioUnlocked) return;
  _audioUnlocked = true;
  [sndCoin, sndLevel, sndMusic].forEach(function(s){
    try{ s.play().then(function(){ s.pause(); s.currentTime=0; }).catch(function(){}); }catch(e){}
  });
}
document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});
document.addEventListener('click',      unlockAudio, {once:true, passive:true});

// ── X-zone control ─────────────────────────────────────────────
(function(){
  var zone = document.getElementById('xzone');
  var xc   = document.getElementById('xcanvas');
  var xctx = xc.getContext('2d');
  var lastDir = null;

  function resize(){
    xc.width  = zone.offsetWidth  * (window.devicePixelRatio||1);
    xc.height = zone.offsetHeight * (window.devicePixelRatio||1);
    xc.style.width  = zone.offsetWidth  + 'px';
    xc.style.height = zone.offsetHeight + 'px';
    drawZone(null);
  }

  function drawZone(activeDir){
    var w = xc.width, h = xc.height;
    var cx = w/2, cy = h/2;
    xctx.clearRect(0,0,w,h);

    var dpr = window.devicePixelRatio||1;

    // ── Background ───────────────────────────────────────────
    // Very subtle dark fill so zone reads as a distinct panel
    xctx.fillStyle = 'rgba(10,0,30,0.6)';
    roundRect(xctx, 0, 0, w, h, 18*dpr);
    xctx.fill();

    // ── Ring geometry ────────────────────────────────────────
    var rOuter = Math.min(w,h)*0.44;   // outer ring radius
    var rInner = Math.min(w,h)*0.16;   // inner dead-zone circle
    var rBtn   = Math.min(w,h)*0.115;  // chevron button circle radius

    // Colours per direction
    var dirMeta = {
      up:    {angle:-Math.PI/2, color:'#00f5ff', glow:'rgba(0,245,255,0.35)', arrow:'↑'},
      down:  {angle: Math.PI/2, color:'#b44dff', glow:'rgba(180,77,255,0.35)', arrow:'↓'},
      left:  {angle: Math.PI,   color:'#ff00c8', glow:'rgba(255,0,200,0.35)', arrow:'←'},
      right: {angle: 0,         color:'#ffe600', glow:'rgba(255,230,0,0.35)', arrow:'→'},
    };

    // ── Outer ring ────────────────────────────────────────────
    // Base ring track
    xctx.beginPath();
    xctx.arc(cx, cy, rOuter, 0, Math.PI*2);
    xctx.strokeStyle = 'rgba(123,47,255,0.25)';
    xctx.lineWidth = 2*dpr;
    xctx.stroke();

    // Thin inner ring
    xctx.beginPath();
    xctx.arc(cx, cy, rOuter*0.72, 0, Math.PI*2);
    xctx.strokeStyle = 'rgba(123,47,255,0.1)';
    xctx.lineWidth = 0.8*dpr;
    xctx.stroke();

    // ── X divider lines (subtle, inside ring) ─────────────────
    xctx.setLineDash([3*dpr, 4*dpr]);
    xctx.strokeStyle = 'rgba(255,255,255,0.06)';
    xctx.lineWidth = 0.8*dpr;
    var lineR = rOuter*0.95;
    xctx.beginPath(); xctx.moveTo(cx-lineR,cy); xctx.lineTo(cx+lineR,cy); xctx.stroke();
    xctx.beginPath(); xctx.moveTo(cx,cy-lineR); xctx.lineTo(cx,cy+lineR); xctx.stroke();
    xctx.setLineDash([]);

    // ── Centre dot ────────────────────────────────────────────
    xctx.beginPath();
    xctx.arc(cx, cy, rInner*0.5, 0, Math.PI*2);
    xctx.fillStyle = 'rgba(123,47,255,0.2)';
    xctx.fill();
    xctx.strokeStyle = 'rgba(180,77,255,0.35)';
    xctx.lineWidth = 1*dpr;
    xctx.stroke();

    // ── Four directional buttons on the ring ──────────────────
    var dirs = ['up','down','left','right'];
    dirs.forEach(function(dir){
      var m = dirMeta[dir];
      var isActive = dir === activeDir;
      var bx = cx + Math.cos(m.angle) * rOuter * 0.72;
      var by = cy + Math.sin(m.angle) * rOuter * 0.72;

      // Glow halo when active
      if(isActive){
        var grd = xctx.createRadialGradient(bx,by,0,bx,by,rBtn*2.2);
        grd.addColorStop(0, m.glow);
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        xctx.beginPath();
        xctx.arc(bx, by, rBtn*2.2, 0, Math.PI*2);
        xctx.fillStyle = grd;
        xctx.fill();
      }

      // Button circle
      xctx.beginPath();
      xctx.arc(bx, by, rBtn, 0, Math.PI*2);
      xctx.fillStyle = isActive
        ? m.color.replace(')', ',0.22)').replace('rgb(','rgba(').replace('#','') // fallback
        : 'rgba(20,0,50,0.7)';
      // Simpler active fill
      xctx.fillStyle = isActive ? 'rgba(40,10,80,0.9)' : 'rgba(10,0,30,0.75)';
      xctx.fill();

      // Button border — neon glow when active
      xctx.strokeStyle = isActive ? m.color : 'rgba(123,47,255,0.4)';
      xctx.lineWidth   = isActive ? 2*dpr : 1.2*dpr;
      if(isActive){
        xctx.shadowColor = m.color;
        xctx.shadowBlur  = 12*dpr;
      }
      xctx.stroke();
      xctx.shadowBlur = 0;

      // Arrow chevron
      var fs = Math.round(rBtn * 1.1);
      xctx.font = 'bold ' + fs + 'px sans-serif';
      xctx.textAlign    = 'center';
      xctx.textBaseline = 'middle';
      xctx.fillStyle    = isActive ? m.color : 'rgba(180,77,255,0.7)';
      if(isActive){
        xctx.shadowColor = m.color;
        xctx.shadowBlur  = 8*dpr;
      }
      xctx.fillText(m.arrow, bx, by + fs*0.05);
      xctx.shadowBlur = 0;
    });

    // ── Outer ring arc segments (coloured per active) ─────────
    // Draw four arc segments between buttons
    var segAngles = [
      {start:-Math.PI*0.75, end:-Math.PI*0.25, dir:'up'},
      {start:-Math.PI*0.25, end: Math.PI*0.25, dir:'right'},
      {start: Math.PI*0.25, end: Math.PI*0.75, dir:'down'},
      {start: Math.PI*0.75, end: Math.PI*1.25, dir:'left'},
    ];
    segAngles.forEach(function(seg){
      var isActive = seg.dir === activeDir;
      var m = dirMeta[seg.dir];
      xctx.beginPath();
      xctx.arc(cx, cy, rOuter, seg.start, seg.end);
      xctx.strokeStyle = isActive ? m.color : 'rgba(123,47,255,0.18)';
      xctx.lineWidth   = isActive ? 3*dpr : 1.5*dpr;
      if(isActive){
        xctx.shadowColor = m.color;
        xctx.shadowBlur  = 10*dpr;
      }
      xctx.stroke();
      xctx.shadowBlur = 0;
    });
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.lineTo(x+w-r, y);
    ctx.quadraticCurveTo(x+w, y, x+w, y+r);
    ctx.lineTo(x+w, y+h-r);
    ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    ctx.lineTo(x+r, y+h);
    ctx.quadraticCurveTo(x, y+h, x, y+h-r);
    ctx.lineTo(x, y+r);
    ctx.quadraticCurveTo(x, y, x+r, y);
    ctx.closePath();
  }

  function dirFromPoint(clientX, clientY){
    var rect = zone.getBoundingClientRect();
    var x = clientX - rect.left;
    var y = clientY - rect.top;
    var cx = rect.width/2, cy = rect.height/2;
    var dx = x - cx, dy = y - cy;
    if(Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';
    return dy > 0 ? 'down' : 'up';
  }

  function applyDir(dir){
    var map = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
    var d = map[dir];
    if(d) queueDir(d[0], d[1]);
    if(dir !== lastDir){ drawZone(dir); lastDir = dir; }
  }

  function clearActive(){
    if(lastDir){ drawZone(null); lastDir = null; }
  }

  zone.addEventListener('pointerdown', function(e){
    e.preventDefault();
    zone.setPointerCapture(e.pointerId);
    applyDir(dirFromPoint(e.clientX, e.clientY));
  }, {passive:false});

  zone.addEventListener('pointermove', function(e){
    e.preventDefault();
    if(e.buttons === 0) return;
    applyDir(dirFromPoint(e.clientX, e.clientY));
  }, {passive:false});

  zone.addEventListener('pointerup',     function(e){ e.preventDefault(); clearActive(); }, {passive:false});
  zone.addEventListener('pointercancel', function(e){ e.preventDefault(); clearActive(); }, {passive:false});

  window.addEventListener('resize', resize);
  // Defer so the zone has laid out
  setTimeout(resize, 0);
})();

// ── Word helpers ───────────────────────────────────────────────
function getWordParts(term){
  // Always treat the full term as one round — multi-word terms stay together
  return [term];
}
function getUniqueLetters(word){
  // Strip spaces — only collect unique a-z letters across the whole term
  var seen={},out=[];
  word.toLowerCase().split('').forEach(function(c){if(/[a-z]/.test(c)&&!seen[c]){seen[c]=true;out.push(c);}});
  return out;
}

// ── Maze helpers ───────────────────────────────────────────────
function isPath(mx,my){return mx>=0&&mx<COLS&&my>=0&&my<ROWS&&maze[my][mx]===0;}
function getOpenCells(){var c=[];for(var y=0;y<ROWS;y++)for(var x=0;x<COLS;x++)if(maze[y][x]===0)c.push({x:x,y:y});return c;}
function calcSlotPositions(n){var m=10,avail=W-m*2,sp=avail/n,pos=[];for(var i=0;i<n;i++)pos.push({x:m+sp*i+sp/2,y:STAGING_H/2});return pos;}

function disperseLetters(uniq,ps){
  var open=getOpenCells().filter(function(c){return!(c.x===ps.x&&c.y===ps.y);});
  var n=uniq.length,bandH=(ROWS-2)/n,result=[];
  for(var i=0;i<n;i++){
    var minY=1+Math.floor(i*bandH),maxY=1+Math.floor((i+1)*bandH);
    var band=open.filter(function(c){return c.y>=minY&&c.y<maxY;});
    if(!band.length)band=open.slice();
    band.sort(function(){return Math.random()-0.5;});
    var placed=false;
    for(var j=0;j<band.length;j++){
      var c=band[j];
      if(!result.some(function(r){return r.mx===c.x&&r.my===c.y;})){result.push({l:uniq[i],mx:c.x,my:c.y,collected:false,slotIdx:i});placed=true;break;}
    }
    if(!placed){
      open.sort(function(){return Math.random()-0.5;});
      for(var j=0;j<open.length;j++){var c=open[j];if(!result.some(function(r){return r.mx===c.x&&r.my===c.y;})){result.push({l:uniq[i],mx:c.x,my:c.y,collected:false,slotIdx:i});break;}}
    }
  }
  return result;
}

// ── Player ─────────────────────────────────────────────────────
function makePlayer(mx,my){return{mx:mx,my:my,tx:mx,ty:my,px:mx*CELL+CELL/2,py:my*CELL+CELL/2+STAGING_H+DEF_H,dx:0,dy:0,moving:false,mouth:0.25,mouthDir:1,tunnelPhase:0,tunnelDir:0};}
function updatePlayer(dt){
  var spd=DIFF[diff].playerSpeed*CELL;

  if(!player.moving){
    if(player.tunnelPhase===0){
      // Normal movement — try queued direction then current
      var nx=player.mx+inputDir.x,ny=player.my+inputDir.y;
      if((inputDir.x||inputDir.y)&&isPath(nx,ny)){
        player.tx=nx;player.ty=ny;player.dx=inputDir.x;player.dy=inputDir.y;player.moving=true;
      } else {
        var cx=player.mx+player.dx,cy=player.my+player.dy;
        if((player.dx||player.dy)&&isPath(cx,cy)){player.tx=cx;player.ty=cy;player.moving=true;}
      }
    } else if(player.tunnelPhase===1){
      // Phase 1 complete — now go invisible and transit off-screen
      // Target: one cell further in same direction (off-canvas)
      player.tunnelPhase=2;
      if(player.tunnelDir===-1){
        // Going left — transit cell is off left edge
        player.tx=-1;player.ty=TELEPORT_ROW;
      } else {
        // Going right — transit cell is off right edge
        player.tx=COLS;player.ty=TELEPORT_ROW;
      }
      player.moving=true;
    } else if(player.tunnelPhase===2){
      // Phase 2 complete (now invisible, off-screen) — snap to opposite mouth
      // and begin phase 3 (emerging, one step into maze)
      player.tunnelPhase=3;
      if(player.tunnelDir===-1){
        // Came from left, emerge on right: mouth is col COLS-1, step into col COLS-2
        player.mx=COLS-1;player.my=TELEPORT_ROW;
        player.px=(COLS-1)*CELL+CELL/2;player.py=TELEPORT_ROW*CELL+CELL/2+STAGING_H+DEF_H;
        player.tx=COLS-2;player.ty=TELEPORT_ROW;
      } else {
        // Came from right, emerge on left: mouth is col 0, step into col 1
        player.mx=0;player.my=TELEPORT_ROW;
        player.px=0*CELL+CELL/2;player.py=TELEPORT_ROW*CELL+CELL/2+STAGING_H+DEF_H;
        player.tx=1;player.ty=TELEPORT_ROW;
      }
      player.moving=true;
    } else if(player.tunnelPhase===3){
      // Phase 3 complete — back to normal
      player.tunnelPhase=0;
      player.tunnelDir=0;
      // Resume normal movement
      var nx2=player.mx+inputDir.x,ny2=player.my+inputDir.y;
      if((inputDir.x||inputDir.y)&&isPath(nx2,ny2)){
        player.tx=nx2;player.ty=ny2;player.dx=inputDir.x;player.dy=inputDir.y;player.moving=true;
      } else {
        var cx2=player.mx+player.dx,cy2=player.my+player.dy;
        if((player.dx||player.dy)&&isPath(cx2,cy2)){player.tx=cx2;player.ty=cy2;player.moving=true;}
      }
    }
  }

  if(player.moving){
    var destX=player.tx*CELL+CELL/2;
    var destY=player.ty*CELL+CELL/2+STAGING_H+DEF_H;
    var remX=destX-player.px,remY=destY-player.py;
    var rem=Math.sqrt(remX*remX+remY*remY);
    var step=spd*(dt/1000);
    if(step>=rem){
      player.px=destX;player.py=destY;
      player.mx=player.tx;player.my=player.ty;
      player.moving=false;

      // Check if we just arrived at a tunnel mouth — begin phase 1
      if(player.tunnelPhase===0&&player.my===TELEPORT_ROW){
        if(player.mx===0&&player.dx===-1){
          // Arrived at left mouth going left — phase 1
          player.tunnelPhase=1;player.tunnelDir=-1;
        } else if(player.mx===COLS-1&&player.dx===1){
          // Arrived at right mouth going right — phase 1
          player.tunnelPhase=1;player.tunnelDir=1;
        }
      }

      // Turn queuing (only in normal phase)
      if(player.tunnelPhase===0){
        var qx=player.mx+inputDir.x,qy=player.my+inputDir.y;
        if((inputDir.x||inputDir.y)&&isPath(qx,qy)){player.dx=inputDir.x;player.dy=inputDir.y;}
      }
    } else {
      var r=step/rem;player.px+=remX*r;player.py+=remY*r;
    }
    player.mouth+=player.mouthDir*0.08;
    if(player.mouth>0.35)player.mouthDir=-1;
    if(player.mouth<0.02)player.mouthDir=1;
  }
  checkPickups();
}

function checkPickups(){
  for(var i=dots.length-1;i>=0;i--){
    if(dots[i].mx===player.mx&&dots[i].my===player.my){dots.splice(i,1);score+=1;renderScore();}
  }
  var remaining=letterTokens.filter(function(t){return!t.collected;}).length;
  for(var i=0;i<letterTokens.length;i++){
    var tok=letterTokens[i];
    if(!tok.collected&&tok.mx===player.mx&&tok.my===player.my){
      tok.collected=true;
      collectedLetters.push(tok.l);
      score+=20;renderScore();
      frightened=true;frightenTimer=DIFF[diff].frightenedTime;
      spawnFlyingLetter(tok);
      var isLast=(remaining===1); // this was the last one
      if(isLast){
        // Play level complete, not coin
        stopMusic();
        playLevelComplete();
      } else {
        playCoin();
      }
    }
  }
  if(letterTokens.length>0&&letterTokens.every(function(t){return t.collected;})&&phase==='maze'){
    running=false;phase='anagram';
    cancelAnimationFrame(frameId);frameId=null;
    setTimeout(showAnagram,500);
  }
}

// ── Flying letters ─────────────────────────────────────────────
function spawnFlyingLetter(tok){
  var startX=tok.mx*CELL+CELL/2,startY=tok.my*CELL+CELL/2+STAGING_H+DEF_H;
  var slot=slotPositions[tok.slotIdx];
  flyingLetters.push({l:tok.l,x:startX,y:startY,startX:startX,startY:startY,targetX:slot.x,targetY:slot.y,t:0,duration:700,done:false,slotIdx:tok.slotIdx});
}
function updateFlyingLetters(dt){
  flyingLetters.forEach(function(fl){
    if(fl.done)return;
    fl.t=Math.min(fl.t+dt,fl.duration);
    var e=1-Math.pow(1-fl.t/fl.duration,3);
    fl.x=fl.startX+(fl.targetX-fl.startX)*e;
    fl.y=fl.startY+(fl.targetY-fl.startY)*e;
    if(fl.t>=fl.duration){fl.done=true;fl.x=fl.targetX;fl.y=fl.targetY;landedLetters[fl.slotIdx]=fl.l;}
  });
}

// ── Ghost ──────────────────────────────────────────────────────
function makeGhost(mx,my,color,mode){return{mx:mx,my:my,tx:mx,ty:my,px:mx*CELL+CELL/2,py:my*CELL+CELL/2+STAGING_H+DEF_H,dx:0,dy:1,moving:false,color:color,mode:mode,spawnMx:mx,spawnMy:my,eaten:false,respawnTimer:0,tunnelTransit:0,tunnelDir:0};}
function updateGhost(g,dt){
  if(g.eaten){g.respawnTimer-=dt;if(g.respawnTimer<=0){g.eaten=false;g.mx=g.spawnMx;g.my=g.spawnMy;g.tx=g.spawnMx;g.ty=g.spawnMy;g.px=g.spawnMx*CELL+CELL/2;g.py=g.spawnMy*CELL+CELL/2+STAGING_H+DEF_H;g.moving=false;}return;}
  var spd=(frightened?DIFF[diff].ghostSpeed*0.4:DIFF[diff].ghostSpeed)*CELL;
  if(!g.moving&&g.tunnelTransit===0){
    var dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    var noRev=dirs.filter(function(d){return!(d.x===-g.dx&&d.y===-g.dy);});
    var valid=noRev.filter(function(d){return isPath(g.mx+d.x,g.my+d.y);});
    if(!valid.length)valid=dirs.filter(function(d){return isPath(g.mx+d.x,g.my+d.y);});
    if(!valid.length)return;
    var chosen;
    if(frightened){chosen=valid[Math.floor(Math.random()*valid.length)];}
    else if(g.mode==='chase'&&Math.random()<0.75){
      valid.sort(function(a,b){return(Math.abs(g.mx+a.x-player.mx)+Math.abs(g.my+a.y-player.my))-(Math.abs(g.mx+b.x-player.mx)+Math.abs(g.my+b.y-player.my));});
      chosen=valid[0];
    }else{
      var straight=valid.filter(function(d){return d.x===g.dx&&d.y===g.dy;});
      chosen=(straight.length&&Math.random()<0.65)?straight[0]:valid[Math.floor(Math.random()*valid.length)];
    }
    g.tx=g.mx+chosen.x;g.ty=g.my+chosen.y;g.dx=chosen.x;g.dy=chosen.y;g.moving=true;
  }
  if(g.moving){
    var destX=g.tx*CELL+CELL/2,destY=g.ty*CELL+CELL/2+STAGING_H+DEF_H;
    var remX=destX-g.px,remY=destY-g.py,rem=Math.sqrt(remX*remX+remY*remY);
    var step=spd*(dt/1000);
    if(step>=rem){
      g.px=destX;g.py=destY;g.mx=g.tx;g.my=g.ty;g.moving=false;
      // Teleport tunnel for ghosts — 3-cell transit
      if(g.my===TELEPORT_ROW){
        if(g.mx<=0&&g.dx===-1){
          g.mx=COLS+2;g.tx=COLS+2;g.px=(COLS+2)*CELL+CELL/2;
          g.tunnelTransit=3;g.tunnelDir=-1;
        } else if(g.mx>=COLS-1&&g.dx===1){
          g.mx=-3;g.tx=-3;g.px=-3*CELL+CELL/2;
          g.tunnelTransit=3;g.tunnelDir=1;
        }
      }
      if(g.tunnelTransit>0){
        g.tunnelTransit--;
        if(g.tunnelTransit===0){
          if(g.tunnelDir===-1){g.mx=COLS-2;g.tx=COLS-2;g.px=(COLS-2)*CELL+CELL/2;}
          else{g.mx=1;g.tx=1;g.px=1*CELL+CELL/2;}
        }
      }
    } else{var r=step/rem;g.px+=remX*r;g.py+=remY*r;}
  }
}
function checkGhostCollisions(){
  ghosts.forEach(function(g){
    if(g.eaten)return;
    var dx=g.px-player.px,dy=g.py-player.py;
    if(Math.sqrt(dx*dx+dy*dy)<CELL*0.72){
      if(frightened){g.eaten=true;g.moving=false;g.respawnTimer=2500;score+=200;renderScore();}
      else playerDied();
    }
  });
}
function playerDied(){
  lives--;renderLives();
  if(lives<=0){gameOver();return;}
  var open=getOpenCells();
  open.sort(function(a,b){return(Math.abs(a.x-9)+Math.abs(a.y-8))-(Math.abs(b.x-9)+Math.abs(b.y-8));});
  var sc=open[0];
  player.mx=sc.x;player.my=sc.y;player.tx=sc.x;player.ty=sc.y;
  player.px=sc.x*CELL+CELL/2;player.py=sc.y*CELL+CELL/2+STAGING_H+DEF_H;
  player.moving=false;player.dx=0;player.dy=0;inputDir={x:0,y:0};
  ghosts.forEach(function(g){g.mx=g.spawnMx;g.my=g.spawnMy;g.tx=g.spawnMx;g.ty=g.spawnMy;g.px=g.spawnMx*CELL+CELL/2;g.py=g.spawnMy*CELL+CELL/2+STAGING_H+DEF_H;g.moving=false;});
}

// ── Start ──────────────────────────────────────────────────────
function showTitle(){
  // Reset to title screen state
  document.getElementById('result-panel').style.display='none';
  document.getElementById('ov').style.display='flex';
  document.getElementById('anagram-panel').classList.remove('show');
  document.getElementById('step-load').style.display='block';
  document.getElementById('step-start').style.display='none';
}
function loadDefinition(){
  score=0;lives=3;roundUsed=[];renderScore();renderLives();
  var avail=VOCAB.filter(function(v){return roundUsed.indexOf(v.term)===-1;});
  var card=avail[Math.floor(Math.random()*avail.length)];
  roundUsed.push(card.term);
  currentTerm=card.term;currentDef=card.def;
  wordParts=getWordParts(currentTerm);partIndex=0;
  document.getElementById('start-def-text').textContent=currentDef;
  document.getElementById('step-load').style.display='none';
  document.getElementById('step-start').style.display='block';
}
function beginMaze(){
  document.getElementById('ov').style.display='none';
  document.getElementById('result-panel').style.display='none';
  startMazeRound();
}

function startMazeRound(){
  var word=wordParts[partIndex];
  uniqueLetters=getUniqueLetters(word);
  targetLetters=word.toLowerCase().replace(/ /g,'').split('');
  shuffledLetters=targetLetters.slice();
  for(var i=shuffledLetters.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=shuffledLetters[i];shuffledLetters[i]=shuffledLetters[j];shuffledLetters[j]=t;}
  slotPositions=calcSlotPositions(shuffledLetters.length);
  var uniqueSlotMap={};
  shuffledLetters.forEach(function(l,i){if(uniqueSlotMap[l]===undefined)uniqueSlotMap[l]=i;});
  frightened=false;frightenTimer=0;
  flyingLetters=[];landedLetters=new Array(shuffledLetters.length).fill(null);
  collectedLetters=[];
  
  
  var tmpl=MAZES[Math.floor(Math.random()*MAZES.length)];
  maze=tmpl.map(function(r){return r.slice();});
  // Find teleport row
  TELEPORT_ROW=-1;
  for(var tr=0;tr<ROWS;tr++){if(maze[tr][0]===0&&maze[tr][COLS-1]===0){TELEPORT_ROW=tr;break;}}
  var open=getOpenCells();
  var ps=open.slice().sort(function(a,b){return(Math.abs(a.x-9)+Math.abs(a.y-8))-(Math.abs(b.x-9)+Math.abs(b.y-8));})[0];
  player=makePlayer(ps.x,ps.y);inputDir={x:0,y:0};
  dots=open.filter(function(c){return!(c.x===ps.x&&c.y===ps.y);}).map(function(c){return{mx:c.x,my:c.y};});
  var dispersed=disperseLetters(uniqueLetters,ps);
  letterTokens=dispersed.map(function(tok){tok.slotIdx=uniqueSlotMap[tok.l]!==undefined?uniqueSlotMap[tok.l]:0;return tok;});
  dots=dots.filter(function(d){return!letterTokens.some(function(t){return t.mx===d.mx&&t.my===d.my;});});
  var cfg=DIFF[diff];
  var farCells=open.slice().sort(function(a,b){return(Math.abs(b.x-ps.x)+Math.abs(b.y-ps.y))-(Math.abs(a.x-ps.x)+Math.abs(a.y-ps.y));});
  ghosts=[];
  for(var g=0;g<cfg.ghosts;g++){
    var gc=farCells[g*4]||farCells[g]||farCells[0];
    ghosts.push(makeGhost(gc.x,gc.y,GHOST_COLS[g%GHOST_COLS.length],g===0?'chase':'wander'));
  }
  running=false;phase='ready';
  playMusic();
  // Draw READY! splash then start
  lastTime=performance.now();
  drawReadySplash();
  setTimeout(function(){
    running=true;phase='maze';
    lastTime=performance.now();
    frameId=requestAnimationFrame(loop);
  },1400);
}

// ── Loop ───────────────────────────────────────────────────────
function loop(ts){
  var dt=Math.min(ts-lastTime,50);lastTime=ts;
  if(frightened){frightenTimer-=dt;if(frightenTimer<=0)frightened=false;}
  updatePlayer(dt);updateFlyingLetters(dt);
  ghosts.forEach(function(g){updateGhost(g,dt);});
  checkGhostCollisions();draw();
  if(running)frameId=requestAnimationFrame(loop);
}

// ── Draw ───────────────────────────────────────────────────────
// ── Synthwave palette ─────────────────────────────────────────
var BG_COL      = '#000008';
var WALL_FILL   = '#0d0025';
var WALL_GLOW   = '#b44dff';
var WALL_INNER  = '#7b2fff';
var DOT_COL     = '#00f5ff';
var TUNNEL_COL  = '#ff00c8';
var PLAYER_COL  = '#ffe600';
var FRIGHT_COL  = '#3d4f9f';

// Draw a neon wall cell with glow border
function drawWallCell(x,y){
  var px=x*CELL, py=y*CELL+STAGING_H+DEF_H;
  ctx.fillStyle=WALL_FILL;
  ctx.fillRect(px,py,CELL,CELL);
  // Outer neon border — only draw edges that face a path cell
  ctx.strokeStyle=WALL_GLOW;
  ctx.lineWidth=1.5;
  // Top edge
  if(y>0&&maze[y-1]&&maze[y-1][x]===0){
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+CELL,py);ctx.stroke();
  }
  // Bottom edge
  if(y<ROWS-1&&maze[y+1]&&maze[y+1][x]===0){
    ctx.beginPath();ctx.moveTo(px,py+CELL);ctx.lineTo(px+CELL,py+CELL);ctx.stroke();
  }
  // Left edge
  if(x>0&&maze[y][x-1]===0){
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+CELL);ctx.stroke();
  }
  // Right edge
  if(x<COLS-1&&maze[y][x+1]===0){
    ctx.beginPath();ctx.moveTo(px+CELL,py);ctx.lineTo(px+CELL,py+CELL);ctx.stroke();
  }
}

function wrapText(ctx,text,x,y,maxW,lineH){
  var words=text.split(' '),line='',lines=[];
  for(var i=0;i<words.length;i++){
    var test=line+(line?' ':'')+words[i];
    if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=words[i];}
    else line=test;
  }
  if(line)lines.push(line);
  // Centre vertically in DEF_H
  var totalH=lines.length*lineH;
  var startY=STAGING_H+(DEF_H-totalH)/2;
  lines.forEach(function(l,i){ctx.fillText(l,x,startY+i*lineH);});
}
function drawReadySplash(){
  draw();
  // Centred READY! text
  var cy=STAGING_H+DEF_H+ROWS*CELL/2;
  ctx.fillStyle='rgba(0,0,8,0.65)';
  ctx.fillRect(W/2-70,cy-22,140,44);
  ctx.strokeStyle='rgba(180,77,255,0.6)';ctx.lineWidth=1.5;
  ctx.strokeRect(W/2-70,cy-22,140,44);
  ctx.shadowColor='#ffe600';ctx.shadowBlur=20;
  ctx.fillStyle='#ffe600';ctx.font='bold 22px monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('READY!',W/2,cy);
  ctx.shadowBlur=0;
}
function draw(){
  // Background
  ctx.fillStyle=BG_COL; ctx.fillRect(0,0,W,H);

  // ── CRT scanlines overlay ──────────────────────────────────
  for(var sl=0;sl<H;sl+=3){
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(0,sl,W,1);
  }

  // ── Staging strip ──────────────────────────────────────────
  ctx.fillStyle='#05001a'; ctx.fillRect(0,0,W,STAGING_H);
  // Neon bottom border of staging strip
  ctx.strokeStyle=WALL_GLOW; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,STAGING_H);ctx.lineTo(W,STAGING_H);ctx.stroke();
  // Slot outlines
  slotPositions.forEach(function(sp,i){
    var ts=Math.min(22,Math.max(14,Math.floor((W-20)/slotPositions.length*0.72)));
    ctx.strokeStyle='rgba(180,77,255,0.3)';ctx.lineWidth=1;
    ctx.strokeRect(sp.x-ts/2,sp.y-ts*0.58,ts,ts*1.16);
    if(landedLetters[i]!==null){
      ctx.fillStyle='rgba(180,77,255,0.15)';ctx.fillRect(sp.x-ts/2,sp.y-ts*0.58,ts,ts*1.16);
      // Neon glow text
      ctx.shadowColor=WALL_GLOW; ctx.shadowBlur=8;
      ctx.fillStyle='#ff00c8';ctx.font='bold '+Math.floor(ts*0.62)+'px monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(landedLetters[i].toUpperCase(),sp.x,sp.y+1);
      ctx.shadowBlur=0;
    }
  });

  // ── Def strip ──────────────────────────────────────────────
  ctx.fillStyle='#03000f'; ctx.fillRect(0,STAGING_H,W,DEF_H);
  ctx.strokeStyle='rgba(180,77,255,0.25)'; ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,STAGING_H+DEF_H);ctx.lineTo(W,STAGING_H+DEF_H);ctx.stroke();
  if(currentDef){
    ctx.shadowColor='rgba(0,245,255,0.4)'; ctx.shadowBlur=4;
    ctx.fillStyle='rgba(0,245,255,0.7)';
    ctx.font='11px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
    wrapText(ctx,currentDef,8,STAGING_H+4,W-16,13);
    ctx.shadowBlur=0;
  }

  // ── Teleport tunnel highlight ──────────────────────────────
  if(TELEPORT_ROW>=0){
    var ty2=TELEPORT_ROW*CELL+STAGING_H+DEF_H;
    ctx.fillStyle='rgba(255,0,200,0.07)';
    ctx.fillRect(0,ty2,W,CELL);
    // Left tunnel mouth
    ctx.strokeStyle=TUNNEL_COL; ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,ty2);ctx.lineTo(0,ty2+CELL);ctx.stroke();
    // Right tunnel mouth
    ctx.beginPath();ctx.moveTo(W,ty2);ctx.lineTo(W,ty2+CELL);ctx.stroke();
    // Tunnel label
    ctx.fillStyle='rgba(255,0,200,0.45)';ctx.font='8px monospace';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText('▶',2,ty2+CELL/2);
    ctx.textAlign='right';
    ctx.fillText('◀',W-2,ty2+CELL/2);
  }

  // ── Maze walls ─────────────────────────────────────────────
  for(var y=0;y<ROWS;y++) for(var x=0;x<COLS;x++){
    if(maze[y][x]===1) drawWallCell(x,y);
  }

  // ── Dots ───────────────────────────────────────────────────
  dots.forEach(function(d){
    var cx=d.mx*CELL+CELL/2, cy=d.my*CELL+CELL/2+STAGING_H+DEF_H;
    ctx.shadowColor=DOT_COL; ctx.shadowBlur=4;
    ctx.fillStyle=DOT_COL;
    ctx.beginPath();ctx.arc(cx,cy,2.2,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // ── Letter tokens (power-pellet style) ─────────────────────
  letterTokens.forEach(function(tok){
    if(tok.collected)return;
    var cx=tok.mx*CELL+CELL/2, cy=tok.my*CELL+CELL/2+STAGING_H+DEF_H;
    // Subtle pulsing halo behind letter
    var pulse=0.5+0.5*Math.sin(Date.now()*0.004);
    ctx.shadowColor='#ff00c8'; ctx.shadowBlur=14*pulse;
    // Letter only — no filled circle
    ctx.fillStyle='#ff00c8';
    ctx.font='bold 13px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(tok.l.toUpperCase(),cx,cy+1);
    ctx.shadowBlur=0;
  });

  // ── Flying letters ──────────────────────────────────────────
  flyingLetters.forEach(function(fl){
    if(fl.done)return;
    ctx.globalAlpha=0.4; ctx.fillStyle='#ff00c8';
    ctx.beginPath();ctx.arc(fl.x,fl.y+5,5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    ctx.shadowColor='#ff00c8'; ctx.shadowBlur=12;
    ctx.fillStyle='#ff00c8';
    ctx.beginPath();ctx.arc(fl.x,fl.y,CELL*0.42,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(fl.l.toUpperCase(),fl.x,fl.y+1);
    ctx.shadowBlur=0;
  });

  // ── Ghosts ─────────────────────────────────────────────────
  ghosts.forEach(function(g){
    if(g.eaten){drawGhostEyes(g.px,g.py);return;}
    drawGhost(g.px,g.py,frightened?FRIGHT_COL:g.color,frightened);
  });

  // ── Player ─────────────────────────────────────────────────
  // Phase 2 = invisible (in tunnel transit)
  if(player.tunnelPhase!==2){
    drawPlayer(player.px,player.py,player.mouth,player.dx,player.dy);
  }

  // ── Frightened bar ─────────────────────────────────────────
  if(frightened){
    var pct=frightenTimer/DIFF[diff].frightenedTime;
    var grad=ctx.createLinearGradient(0,0,W*pct,0);
    grad.addColorStop(0,'rgba(180,77,255,0.6)');
    grad.addColorStop(1,'rgba(255,0,200,0.3)');
    ctx.fillStyle=grad; ctx.fillRect(0,H-4,W*pct,4);
  }
}
function drawPlayer(px,py,mouth,dx,dy){
  var r=CELL*0.44,ma=0;
  if(dx>0)ma=0;else if(dx<0)ma=Math.PI;else if(dy>0)ma=Math.PI/2;else if(dy<0)ma=-Math.PI/2;
  ctx.shadowColor=PLAYER_COL; ctx.shadowBlur=16;
  ctx.fillStyle=PLAYER_COL;
  ctx.beginPath();ctx.moveTo(px,py);
  ctx.arc(px,py,r,ma+(mouth<0.05?0.05:mouth),ma+Math.PI*2-(mouth<0.05?0.05:mouth));
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // Eye
  var ex=px+Math.cos(ma-Math.PI/3.5)*r*0.52, ey=py+Math.sin(ma-Math.PI/3.5)*r*0.52;
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();
}

function drawGhost(px,py,col,fright){
  var r=CELL*0.42,top=py-r,bot=py+r*0.9;
  ctx.shadowColor=fright?FRIGHT_COL:col; ctx.shadowBlur=fright?8:14;
  ctx.fillStyle=fright?FRIGHT_COL:col;
  ctx.beginPath();ctx.arc(px,top+r,r,Math.PI,0);
  var segs=4,segW=(r*2)/segs;
  for(var i=0;i<=segs;i++)ctx.lineTo(px-r+i*segW,i%2===0?bot:bot-r*0.35);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  if(!fright){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-r*0.3,top+r*0.55,r*0.22,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px+r*0.3,top+r*0.55,r*0.22,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(px-r*0.28,top+r*0.56,r*0.1,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(px+r*0.28,top+r*0.56,r*0.1,0,Math.PI*2);ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,255,255,0.4)';
    ctx.fillRect(px-r*0.5,top+r*0.35,r*0.22,r*0.16);
    ctx.fillRect(px+r*0.28,top+r*0.35,r*0.22,r*0.16);
  }
}

function drawGhostEyes(px,py){
  var r=CELL*0.42,top=py-r;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px-r*0.3,top+r*0.55,r*0.22,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(px+r*0.3,top+r*0.55,r*0.22,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#44f';ctx.beginPath();ctx.arc(px-r*0.3,top+r*0.55,r*0.12,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(px+r*0.3,top+r*0.55,r*0.12,0,Math.PI*2);ctx.fill();
}

// ── Game over ──────────────────────────────────────────────────
function gameOver(){
  running=false;phase='over';stopMusic();
  if(frameId){cancelAnimationFrame(frameId);frameId=null;}
  document.getElementById('ov').style.display='none';
  var rp=document.getElementById('result-panel');
  rp.innerHTML='<div style="font-size:20px;font-weight:700;color:#ff3333;font-family:monospace;letter-spacing:0.1em;text-shadow:0 0 14px #ff3333;">GAME OVER</div>'
    +'<div style="font-size:13px;color:rgba(255,255,255,0.6);text-align:center;line-height:1.6">The term was<br>'
    +'<span style="color:#ff00c8;font-size:17px;letter-spacing:2px;font-family:monospace;text-shadow:0 0 10px #ff00c8;">'+currentTerm.toUpperCase()+'</span></div>'
    +'<button class="gbtn" onclick="showTitle()">▶ Play again</button>';
  rp.style.display='flex';
}

// ── Anagram ────────────────────────────────────────────────────
function showAnagram(){
  // Build answer structure: full term chars including spaces as fixed dividers
  answerStructure=currentTerm.toLowerCase().split('');
  
  
  anagramAnswer=new Array(targetLetters.length).fill(null);
  document.getElementById('anagram-feedback').textContent='';
  document.getElementById('anagram-prompt').textContent=wordParts.length>1?'Spell word '+(partIndex+1)+': tap letters in order':'Tap letters in the correct order to spell the word';
  document.getElementById('anagram-def').textContent=currentDef;
  document.getElementById('check-btn').disabled=true;
  applyAnagramSizing();buildBank();buildSlots();
  document.getElementById('anagram-panel').classList.add('show');
}
function applyAnagramSizing(){
  var panel=document.getElementById('anagram-panel');
  var n=answerStructure.length,panelW=panel.offsetWidth||336,available=panelW-24;
  var tileF=available/(n+(n-1)*0.18);
  var tile=Math.max(20,Math.min(36,Math.floor(tileF)));
  var gap=Math.max(3,Math.min(7,Math.floor(tile*0.18)));
  var fs=Math.max(10,Math.min(18,Math.floor(tile*0.58)));
  panel.style.setProperty('--ts',tile+'px');panel.style.setProperty('--fs',fs+'px');panel.style.setProperty('--lg',gap+'px');
}
function buildBank(){
  var lb=document.getElementById('letter-bank');lb.innerHTML='';
  shuffledLetters.forEach(function(l,i){
    var btn=document.createElement('div');btn.className='bank-letter';btn.textContent=l.toUpperCase();btn.dataset.idx=i;
    btn.onclick=function(){
      if(btn.classList.contains('used'))return;
      for(var s=0;s<anagramAnswer.length;s++){if(anagramAnswer[s]===null){anagramAnswer[s]={letter:l,bankIdx:i};btn.classList.add('used');playCoin();renderSlots2();return;}}
    };
    lb.appendChild(btn);
  });
}
function buildSlots(){
  var as=document.getElementById('answer-slots');as.innerHTML='';
  // answerStructure: full term chars including spaces
  // space positions are pre-filled dividers, letter positions are interactive
  var letterSlotIndex=0;
  for(var s=0;s<answerStructure.length;s++){
    if(answerStructure[s]===' '){
      // Fixed space divider tile
      var sp=document.createElement('div');
      sp.className='ans-slot space-tile';
      sp.textContent='·';
      sp.style.borderStyle='none';
      sp.style.color='rgba(255,255,255,0.2)';
      sp.style.cursor='default';
      sp.style.background='transparent';
      as.appendChild(sp);
    } else {
      var sl=document.createElement('div');sl.className='ans-slot';sl.dataset.slot=letterSlotIndex;
      (function(el,si){el.onclick=function(){
        if(anagramAnswer[si]!==null){
          document.getElementById('letter-bank').children[anagramAnswer[si].bankIdx].classList.remove('used');
          anagramAnswer[si]=null;renderSlots2();
        }
      };})(sl,letterSlotIndex);
      as.appendChild(sl);
      letterSlotIndex++;
    }
  }
}
function renderSlots2(){
  var as=document.getElementById('answer-slots');
  document.getElementById('anagram-feedback').textContent='';
  // Rebuild: iterate answerStructure, track letter slot index separately
  var letterSlotIndex=0;
  for(var s=0;s<as.children.length;s++){
    var el=as.children[s];
    if(el.classList.contains('space-tile')) continue; // skip fixed space tiles
    el.className='ans-slot';
    if(anagramAnswer[letterSlotIndex]!==null){
      el.textContent=anagramAnswer[letterSlotIndex].letter.toUpperCase();
      el.classList.add('filled');
    } else {
      el.textContent='';
    }
    letterSlotIndex++;
  }
  document.getElementById('check-btn').disabled=!anagramAnswer.every(function(a){return a!==null;});
}
function resetAnagram(){
  anagramAnswer=new Array(targetLetters.length).fill(null);
  document.querySelectorAll('.bank-letter').forEach(function(b){b.classList.remove('used');});
  renderSlots2();document.getElementById('anagram-feedback').textContent='';
}
function checkAnagram(){
  var attempt=anagramAnswer.map(function(a){return a?a.letter:'';}).join('');
  var target=targetLetters.join('');
  var as=document.getElementById('answer-slots'),fb=document.getElementById('anagram-feedback');
  if(attempt===target){
    // Mark all slots correct, space tiles auto-correct
    for(var s=0;s<as.children.length;s++){
      if(as.children[s].classList.contains('space-tile')){
        as.children[s].style.color='#2dcab0';
      } else {
        as.children[s].className='ans-slot filled correct';
      }
    }
    fb.style.color='#2dcab0';fb.textContent='✓ Correct!';playLevelComplete();
    score+=100;renderScore();document.getElementById('check-btn').disabled=true;
    setTimeout(function(){
      document.getElementById('anagram-panel').classList.remove('show');
      partIndex++;
      if(partIndex<wordParts.length)startMazeRound();else roundComplete();
    },900);
  }else{
    fb.style.color='#ff5050';fb.textContent='Not quite — try again!';
    // Mark letter slots correct/wrong, leave space tiles untouched
    var letterSlotIndex=0;
    for(var s=0;s<as.children.length;s++){
      if(as.children[s].classList.contains('space-tile')) continue;
      var correct=(attempt[letterSlotIndex]===target[letterSlotIndex]);
      as.children[s].className='ans-slot filled'+(correct?' correct':' wrong');
      letterSlotIndex++;
    }
    lives--;renderLives();
    if(lives<=0){setTimeout(gameOver,600);return;}
    setTimeout(function(){resetAnagram();},900);
  }
}
function roundComplete(){
  score+=200;renderScore();stopMusic();
  var rp=document.getElementById('result-panel');
  rp.innerHTML='<div style="font-size:16px;font-weight:700;color:#00f5ff;font-family:monospace;text-shadow:0 0 12px #00f5ff;letter-spacing:0.05em">✓ WORD COMPLETE</div>'
    +'<div style="font-size:20px;color:#ff00c8;letter-spacing:3px;font-weight:700;font-family:monospace;text-shadow:0 0 16px #ff00c8;">'+currentTerm.toUpperCase()+'</div>'
    +'<div style="font-size:13px;color:#ffe600;font-family:monospace;text-shadow:0 0 8px #ffe600;">SCORE: '+score+'</div>'
    +'<button class="gbtn" onclick="nextWord()">Next word ▶</button>';
  rp.style.display='flex';
}
function nextWord(){
  document.getElementById('anagram-panel').classList.remove('show');
  document.getElementById('result-panel').style.display='none';
  var avail=VOCAB.filter(function(v){return roundUsed.indexOf(v.term)===-1;});
  if(!avail.length){roundUsed=[];avail=VOCAB.slice();}
  var card=avail[Math.floor(Math.random()*avail.length)];
  roundUsed.push(card.term);
  currentTerm=card.term;currentDef=card.def;
  wordParts=getWordParts(currentTerm);partIndex=0;
  // Show definition directly — skip the Load Definition step
  document.getElementById('start-def-text').textContent=currentDef;
  document.getElementById('step-load').style.display='none';
  document.getElementById('step-start').style.display='block';
  document.getElementById('ov').style.display='flex';
}
window.addEventListener('resize',function(){if(phase==='anagram')applyAnagramSizing();});
ctx.fillStyle='#0d1220';ctx.fillRect(0,0,W,H);
</script>
